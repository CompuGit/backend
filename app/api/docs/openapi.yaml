openapi: 3.0.3
info:
  title: CompuGit Backend
  version: 1.0.0
  description: CompuGit Backend API
servers:
  - url: /
    description: Current server
tags:
  - name: Health
  - name: Authentication
  - name: Users
  - name: Backup
x-route-doc-files:
  - health.yaml
  - auth.yaml
  - users.yaml
  - backup.yaml
paths: {}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Welcome:
      type: object
      properties:
        status:
          type: string
          example: OK
        message:
          type: string
    RegisterRequest:
      type: object
      required: [userName, password]
      properties:
        userName:
          type: string
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    PasswordUpdateRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
    CreateUserRequest:
      type: object
      required: [userName, canLogin]
      properties:
        userName:
          type: string
        canLogin:
          type: boolean
      additionalProperties: true
